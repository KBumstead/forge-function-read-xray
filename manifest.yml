modules:
  # Core function that reads Xray data. It is exposed through a web trigger so
  # it can be called from scripts, pipelines or other services.
  function:
    - key: read-xray
      handler: index.handler
  webtrigger:
    - key: read-xray-webtrigger
      function: read-xray

app:
  # Replaced by `forge register` with your real app id.
  id: ari:cloud:ecosystem::app/00000000-0000-0000-0000-000000000000
  runtime:
    name: nodejs22.x

permissions:
  scopes:
    - read:jira-work
  external:
    fetch:
      backend:
        # Xray Cloud API (global + regional endpoints).
        - https://xray.cloud.getxray.app
        - https://us.xray.cloud.getxray.app
        - https://eu.xray.cloud.getxray.app
        - https://au.xray.cloud.getxray.app
