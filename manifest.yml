modules:
  function:
    # Web trigger entry point (scripts, pipelines, other services).
    - key: read-xray
      handler: index.handler
    # Rovo entry point.
    - key: read-xray-rovo
      handler: index.rovoHandler
    # Backend for the Jira admin settings page.
    - key: settings-resolver
      handler: index.settingsHandler

  webtrigger:
    - key: read-xray-webtrigger
      function: read-xray

  # Rovo action. Listing it in the rovo:mcp module below exposes it as a tool,
  # so it appears in Rovo Studio under "Connected apps" and can be added to
  # any Rovo agent.
  action:
    - key: read-xray-data
      name: Read Xray test data
      function: read-xray-rovo
      actionVerb: GET
      description: >-
        Reads Xray data: tests with their test run results (PASSED/FAILED)
        per execution, test executions, plans and sets. Pass just an issue key
        (story, test or execution) and the type is detected. jiraStatus is not
        a test result.
      inputs:
        type:
          title: Data type
          type: string
          required: false
          description: >-
            Optional. One of: tests, testExecutions, testPlans, testSets. Leave
            empty with an issue key to detect it automatically: a Test, Test
            Execution, Test Plan, Test Set, or else the Tests linked to the
            issue (for example a story). Tests include their test runs.
        key:
          title: Issue key
          type: string
          required: false
          description: A single Jira issue key, for example ABC-123.
        jql:
          title: JQL query
          type: string
          required: false
          description: >-
            JQL that selects the Xray issues, for example
            project = ABC AND issuetype = Test. Ignored when an issue key is given.
        limit:
          title: Max results
          type: integer
          required: false
          description: Maximum number of results to return, 1-100. Default is 10.
        start:
          title: Offset
          type: integer
          required: false
          description: Offset for paging through results. Default is 0.

  rovo:mcp:
    - key: xray-reader-mcp
      name: Xray Reader
      tools:
        - read-xray-data

  # Settings page for the Xray Client ID / Secret. Two entries, same page:
  #  - the first shows in the Jira Settings > Apps sidebar;
  #  - the second (useAsConfig) adds a "Configure" button for the app in
  #    Connected apps / Manage apps. Entries with useAsConfig are NOT shown
  #    in the sidebar, which is why both are needed.
  jira:adminPage:
    - key: xray-reader-settings
      title: Xray Reader settings
      resource: settings-page
      resolver:
        function: settings-resolver
      render: native
    - key: xray-reader-configure
      title: Xray Reader settings
      resource: settings-page
      resolver:
        function: settings-resolver
      render: native
      useAsConfig: true

resources:
  - key: settings-page
    path: src/frontend/index.jsx

app:
  id: ari:cloud:ecosystem::app/ece8b991-1555-40b5-8344-59421436d8e6
  runtime:
    name: nodejs22.x

permissions:
  scopes:
    - read:jira-work
    # Stores the Xray credentials saved on the settings page (secret encrypted).
    - storage:app
  external:
    fetch:
      backend:
        # Xray Cloud API (global + regional endpoints).
        - address: https://xray.cloud.getxray.app
        - address: https://us.xray.cloud.getxray.app
        - address: https://eu.xray.cloud.getxray.app
        - address: https://au.xray.cloud.getxray.app
